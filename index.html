<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给小猪的信</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body {
            background-image: url('book.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 200px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
            pointer-events: none;
        }
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.85);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            pointer-events: none;
            z-index: 1;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 30px rgba(255, 182, 193, 0.8);
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
        .click-hint {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
            animation: pulse 1.8s infinite;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .envelope-container {
            position: relative;
            width: 440px;
            height: 300px;
            perspective: 1000px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 粉色信封外壳 */
        .envelope {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f582ae;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            transition: transform 0.4s ease, opacity 0.8s ease;
            z-index: 3;
        }
        .envelope-container:hover .envelope {
            transform: translateY(-5px);
        }
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 220px solid transparent;
            border-right: 220px solid transparent;
            border-top: 170px solid #f26b9c;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }
        .wax-seal {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            background: #e63946;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
            z-index: 5;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 220px solid #f793b8;
            border-right: 220px solid #f793b8;
            border-bottom: 150px solid #ffa3c5;
            border-top: 110px solid transparent;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 3;
        }
        
        /* 半透明磨砂玻璃信纸 */
        .letter {
            position: absolute;
            width: 410px;
            height: 280px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            padding: 25px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            overflow: hidden;
            opacity: 0;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        
        .letter-title {
            font-size: 22px;
            color: #d63384;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .letter-body {
            font-size: 18px;
            color: #2b2b2b;
            line-height: 1.4;
        }
        .letter-body p {
            margin-bottom: 8px;
            min-height: 24px;
            word-break: break-all;
        }
        
        .letter-footer {
            text-align: right;
            margin-top: 25px;
            color: #555;
            font-size: 14px;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .letter-footer .sig {
            font-size: 18px;
            color: #d63384;
            font-weight: bold;
            margin-top: 4px;
        }
        
        /* 打开动画控制 */
        .envelope-container.open .flap {
            transform: rotateX(180deg);
        }
        .envelope-container.open .wax-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.5);
        }
        /* 粉色外壳平滑淡出并消失 */
        .envelope-container.open .envelope {
            opacity: 0;
            pointer-events: none;
        }
        /* 信纸展开并显示 */
        .envelope-container.open .letter {
            opacity: 1;
            width: 500px;
            height: auto;
            max-height: 70vh;
            padding: 30px 35px;
            z-index: 10;
            pointer-events: auto;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
            overflow-y: auto;
            transform: translateY(-20px);
        }

        .letter::-webkit-scrollbar {
            width: 5px;
        }
        .letter::-webkit-scrollbar-thumb {
            background-color: rgba(214, 51, 132, 0.3);
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .envelope-container.open .letter {
                width: 88vw;
                max-height: 65vh;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="click-hint" id="hint">开启</div>
    <div class="envelope-container" id="envelopeContainer" onclick="openEnvelope()">
        <!-- 1. 粉色信封外壳（点击后淡出隐藏） -->
        <div class="envelope">
            <div class="flap"></div>
            <div class="wax-seal">❤️</div>
            <div class="pocket"></div>
        </div>
        <!-- 2. 半透明信纸（独立开来，信封隐藏后依然展示） -->
        <div class="letter" id="letter">
            <div class="letter-title">小猪：</div>
            <div class="letter-body" id="letterText"></div>
            <div class="letter-footer" id="letterFooter">
                <div>2026年8月19日</div>
                <div class="sig">你的宝宝</div>
            </div>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.fontSize = Math.random() * 30 + 45 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 7000);
        }
        setInterval(createHeart, 350);

        let isOpen = false;
        const paragraphs = ["宝宝，是谁想到你", "嘴角就不自觉上扬", "是谁日思夜想", "期待与你相见", "", "宝宝，你知道吗？", "失去你消息的我", "在分隔空间寻找存在", "用爱的光把虚拟分开", "撕破夜幕的阻碍", "光线穿越天罩的掩盖", "跟踪心跳的节拍现在", "站在城市中", "寂寞电波穿梭闪烁", "期待联络", "寻找你的全部线索", "Pretty Boy回答回答", "是你在喂喂喂吗", "送你的Radar Radar", "感应我的方向吧", "", "Pretty Boy 回复加快", "Answer me tonight tonight it's tonight", "Pretty Boy 留言等待", "Please tell me alright alright it's alright", "接收我的爱", "", "七夕快乐！"];

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;
            
            // 点击后通过 JS 强制隐藏“开启”提示词
            const hintElem = document.getElementById('hint');
            if (hintElem) {
                hintElem.style.display = 'none';
            }

            document.getElementById('envelopeContainer').classList.add('open');
            setTimeout(typeWriter, 600);
        }

        let pIndex = 0;
        let charIndex = 0;
        const textContainer = document.getElementById('letterText');

        function typeWriter() {
            if (pIndex < paragraphs.length) {
                let currentP = textContainer.children[pIndex];
                if (!currentP) {
                    currentP = document.createElement('p');
                    textContainer.appendChild(currentP);
                }
                
                const text = paragraphs[pIndex];
                
                // 处理空行的情况
                if (text === "") {
                    currentP.innerHTML = "&nbsp;";
                    pIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 100);
                    return;
                }

                currentP.innerHTML = text.substring(0, charIndex + 1) + '<span class="cursor"></span>';
                charIndex++;
                
                if (charIndex < text.length) {
                    setTimeout(typeWriter, 60);
                } else {
                    const cursor = currentP.querySelector('.cursor');
                    if(cursor) cursor.remove();
                    pIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 200);
                }
            } else {
                document.getElementById('letterFooter').style.opacity = '1';
            }
        }
    </script>
</body>
</html>
